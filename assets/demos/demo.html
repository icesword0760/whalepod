<html lang="zh-CN"><meta charset="utf-8"><title>WhalePod · 模拟数据演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#252932;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header.hero{height:88px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between}.hero h1{font-size:24px;margin:0 0 5px;font-weight:650}.sub{color:#727985;font-size:13px}.badge{background:#fff;border:1px solid #dce1ea;border-radius:20px;padding:8px 14px;color:#626b7c;font-size:12px}.app{margin:0 22px;height:590px;display:flex;border:1px solid #dfe1e6;border-radius:13px;overflow:hidden;background:#f4f5f7;box-shadow:0 8px 26px #273b5610;position:relative}aside{width:205px;flex-shrink:0;background:#f8f9fa;border-right:1px solid #e1e3e7;padding:14px}.traffic{display:flex;gap:7px;margin:0 0 23px}.traffic i{width:11px;height:11px;border-radius:50%;background:#ff6259}.traffic i:nth-child(2){background:#ffbd2e}.traffic i:nth-child(3){background:#28c840}.brand{font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:7px}.brand small{font-size:9px;background:#222;color:#fff;padding:2px 4px}.sidebutton{border:1px solid #dce0e5;border-radius:11px;text-align:center;padding:10px;margin-bottom:23px}.label{font-size:12px;color:#858c98;margin:17px 0 10px}.row{padding:10px 9px;border-radius:7px;font-size:13px;display:flex;align-items:center;justify-content:space-between}.row.active{background:#e9edf4;color:#4b7df3}.row small{color:#9a9fa8}.bottom{position:absolute;bottom:18px;line-height:2.7;font-size:13px}.viewport{flex:1;overflow:hidden;padding:10px;position:relative}.cards{display:flex;gap:12px;height:100%;position:relative}.card{position:relative;flex-shrink:0;width:350px;height:100%;background:#fff;border:1px solid #e1e3e8;border-radius:11px;box-shadow:0 2px 5px #00000005;overflow:hidden}.cardHead{height:48px;padding:15px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #f0f1f4;display:flex;justify-content:space-between}.actions{color:#8b929c;font-weight:400;letter-spacing:5px}.tabs{height:37px;padding:7px 18px;color:#858c98;font-size:12px;border-bottom:1px solid #eee}.tabs b{color:#5484fb;border-bottom:2px solid;padding-bottom:11px;margin-right:22px}.body{padding:23px 22px;font-size:14px;line-height:1.85}.muted{color:#969da8;font-size:12px}.user{background:#edf3ff;border-radius:15px;padding:9px 13px;margin:18px 0 22px 25px}.body h3{font-size:17px;font-weight:600}.body ul{padding-left:20px}.composer{position:absolute;bottom:25px;left:15px;right:15px;height:99px;border:1px solid #e9eaee;border-radius:17px;box-shadow:0 3px 16px #202e4110;padding:13px;color:#b3b8c2;font-size:12px;background:white}.composer .tools{position:absolute;bottom:14px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;color:#9199a6}.send{background:#a9c1fc;border-radius:50%;color:white;padding:4px 9px;font-size:18px}.status{position:absolute;bottom:6px;left:22px;font-size:10px;color:#939ba8}.green{color:#439c78}.cursor{position:absolute;width:22px;height:28px;z-index:50;filter:drop-shadow(1px 2px 2px #0003);pointer-events:none}.cursor svg{width:100%;height:100%}.ripple{position:absolute;border:3px solid #648cf5;border-radius:50%;z-index:49;pointer-events:none}.footer{height:62px;padding:16px 29px;display:flex;justify-content:space-between;font-size:14px;color:#58616f}.footer b{color:#4578eb;margin-right:10px}.watermark{font-size:12px;color:#88919d}.overlay{position:absolute;inset:0;background:#17243825;display:flex;align-items:center;justify-content:center;z-index:20}.modal{width:855px;height:507px;background:#fff;border-radius:14px;box-shadow:0 18px 60px #26364d2e;overflow:hidden}.modalhead{height:76px;padding:18px 23px;border-bottom:1px solid #eef0f3}.modalhead h2{margin:0 0 7px;font-size:20px}.modalhead .close{float:right;color:#8d96a1}.project{padding:13px 23px;font-size:12px;border-bottom:1px solid #eef0f3}.importgrid{display:grid;grid-template-columns:335px 1fr;height:296px}.list{padding:14px;border-right:1px solid #eee}.search{border:1px solid #e1e4eb;border-radius:7px;padding:10px;color:#959daa;font-size:12px}.filters{display:flex;gap:9px;margin:12px 0;font-size:12px}.filters span{padding:6px 9px}.filters .sel{background:#edf2ff;color:#5585f9;border-radius:6px}.item{padding:12px 10px;margin:4px 0;border-radius:7px;font-size:13px}.item.selected{background:#f0f4ff}.item small{display:block;font-size:11px;color:#939caa;margin-top:6px}.preview{padding:18px 24px;line-height:1.9;font-size:13px}.preview h3{margin:0 0 8px;font-size:16px}.modalfoot{border-top:1px solid #eee;padding:15px 23px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.btn{background:#5482f5;color:white;border-radius:7px;padding:10px 15px}.dag{position:relative;height:425px;background-color:#fafbfc;background-image:radial-gradient(#dce1e9 .8px,transparent .8px);background-size:18px 18px}.node{position:absolute;width:205px;padding:17px;background:#fff;border:1px solid #dee4ed;border-radius:10px;box-shadow:0 3px 9px #24365509;font-size:13px}.node small{display:block;color:#939da9;font-size:11px;margin-top:8px}.node.selected{border-color:#5f8af7;box-shadow:0 0 0 3px #e4edff}.toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 20px;border:1px solid #e2e8e4;border-radius:9px;box-shadow:0 5px 25px #0001;z-index:25;font-size:13px}.empty{text-align:center;margin-top:133px;font-size:25px;font-weight:600}.menu{position:absolute;bottom:126px;left:231px;width:272px;border:1px solid #e3e6ec;border-radius:12px;background:white;padding:8px;z-index:22;box-shadow:0 7px 24px #0001}.menu div{padding:12px;font-size:13px}.menu div:last-child{background:#f0f4ff;color:#4c7dec;border-radius:7px}
</style>
<header class="hero"><div><h1 id="title"></h1><div class="sub">WhalePod · 鲸群 / 多会话工作台</div></div><span class="badge">MOCK DEMO · 全部为虚构数据</span></header>
<div class="app" id="app"></div><div class="footer"><div id="caption"></div><span class="watermark">交互示意 · 非真实会话录屏</span></div>
<script>
const titles=['方案探索','界面实现','回归检查'];
function side(){return `<aside><div class="traffic"><i></i><i></i><i></i></div><div class="brand">deepseek <small>HARNESS</small></div><div class="sidebutton">新建工作区</div><div class="label">工作区</div><div class="row">⌄ ▱ 海岛日历 <span>＋</span></div><div class="row active">☰ 新版首页 <small>3 个会话</small></div><div class="row">☰ 体验优化 <small>1 个会话</small></div><div class="bottom">✧ 技能和连接器<br>⚙ 设置</div></aside>`}
function card(i,extra=''){let body=[`<div class="user">给日历首页设计两个布局方向。</div><div class="muted">已思考 ✓</div><h3>先把今天的安排看清楚</h3><p>建议保留两个方向，分开验证：</p><ul><li>时间线：突出下一件事</li><li>周视图：适合查看空闲时间</li></ul><p>先用示例日程比较阅读体验。</p>`,`<div class="user">先实现时间线方向。</div><div class="muted">已思考 ✓</div><h3>首页结构已完成</h3><p>顶部展示日期，下方按时间排列。</p><ul><li>09:30　设计讨论</li><li>14:00　版本检查</li></ul><p class="green">✓ 窄窗口布局已检查</p>`,`<div class="user">检查空状态和不同窗口尺寸。</div><div class="muted">已思考 ✓</div><h3>检查结果</h3><p class="green">✓ 空白日程提示正常<br>✓ 长标题保持完整<br>✓ 窄窗口排版正常</p><p>示例数据下的检查已结束。</p>`][i];return `<section class="card" id="card${i}" style="${extra}"><div class="cardHead">${titles[i]}<span class="actions">⊞ ◫ ⋯</span></div><div class="tabs"><b>对话</b>轨迹</div><div class="body"><div class="muted">▤ 系统提示词</div>${body}</div><div class="composer">发消息或创建任务，/ 调用指令<div class="tools"><span>＋　♧ 工作区内修改</span><span class="send">↑</span></div></div><div class="status">标准模式 · 示例会话</div></section>`}
const ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
function cursor(x,y,click=false){return `<div class="cursor" style="left:${x}px;top:${y}px"><svg viewBox="0 0 24 30"><path d="M3 2L3 24L9 18L14 28L18 26L13 17L22 17Z" fill="#293447" stroke="white" stroke-width="1.8"/></svg></div>${click?`<div class="ripple" style="left:${x-14}px;top:${y-14}px;width:36px;height:36px"></div>`:''}`}
function label(title,step,text){document.querySelector('#title').textContent=title;document.querySelector('#caption').innerHTML=`<b>${step}</b>${text}`}
function importModal(t){let search=t>3,selected=t>4.5;return `<div class="overlay"><div class="modal"><div class="modalhead"><span class="close">×</span><h2>导入会话</h2><div class="sub">把其他智能体的文字对话带入当前空白会话</div></div><div class="project">▱ 海岛日历 <span class="muted">　/demo/island-calendar</span><span style="float:right">仅当前项目</span></div><div class="importgrid"><div class="list"><div class="search">⌕　${search?'空状态':'搜索标题或最新消息'}</div><div class="filters"><span>全部</span><span class="sel">Claude Code</span><span>Codex</span></div><div class="muted">${search?'1':'3'} 个会话 · 最近更新</div>${(search?['空状态文案']:['首页结构讨论','空状态文案','日历交互检查']).map(n=>`<div class="item ${selected?'selected':''}">${n}<small>Claude Code · 示例时间 10:30</small><small>${n==='空状态文案'?'没有日程时，保留一个清晰入口。':'使用虚构日程讨论界面。'}</small></div>`).join('')}</div><div class="preview">${selected?'<h3>空状态文案</h3><div class="muted">Claude Code · 4 条文字消息</div><div class="user">没有日程的时候，显示什么？</div><p>今天还没有安排。</p><p>添加第一项日程，把时间留给重要的事。</p>':'<div style="text-align:center;margin-top:78px;color:#8d95a0">选择一个会话<br><small>在这里预览对话，再导入当前卡片</small></div>'}</div></div><div class="modalfoot"><span>导入后可继续对话，原始会话保持不变。</span><span class="btn" style="opacity:${selected?1:.45}">${t>6.4?'正在导入…':'导入此会话'}</span></div></div></div>`}
window.renderFrame=function(scene,t){let html=side();if(scene==='dag')html=html.replace('3 个会话</small>', '3 个会话　♧</small>');let c='';if(scene==='cards'){let resize=ease((t-1.3)/1.2),reset=ease((t-3.5)/.7),w=350+115*resize*(1-reset);let drag=ease((t-5.2)/1.2),lift=t>4.8&&t<6.6;html+=`<main class="viewport"><div class="cards">${card(0,`width:${w}px;transform:translateX(${362*drag}px)`)}${card(1,`transform:translate(${-(w+12)*drag}px,${lift?-7:0}px) scale(${lift?1.012:1});z-index:2;box-shadow:${lift?'0 14px 27px #23334c26':'0 2px 5px #00000005'}`)}${card(2)}</div></main>`;if(t<3.5)c=cursor(568+115*resize,270,t>1.3&&t<1.6);else if(t<4.6)c=cursor(330,32,t<3.9);else c=cursor(705-362*drag,32,lift&&t<5.2);label('多会话并排，各自保持进度',t<3.5?'01 / 调整宽度':t<4.6?'02 / 双击恢复':'03 / 长按排序',t<3.5?'拖动卡片边缘，留出需要的阅读空间':t<4.6?'双击卡片头，回到默认宽度':'长按后卡片悬浮，拖动改变顺序');}
if(scene==='dag'){html+=`<main class="viewport"><div class="cards">${card(t>5.8?1:0)}${card(2)}</div></main>`;if(t>1&&t<5.8){html+=`<div class="overlay"><div class="modal"><div class="modalhead"><span class="close">×</span><h2>会话 DAG</h2><div class="sub">海岛日历 / 新版首页</div></div><div class="dag"><svg style="position:absolute;inset:0" width="855" height="425"><path d="M290 185 C390 185 390 90 485 90 M290 185 C390 185 390 290 485 290" fill="none" stroke="#b9c9e9" stroke-width="2"/></svg><div class="node" style="left:85px;top:151px">方案探索<small>主会话 · 两个布局方向</small></div><div class="node ${t>3.3?'selected':''}" style="left:485px;top:55px">界面实现<small>子分支 · 时间线方向</small></div><div class="node" style="left:485px;top:255px">回归检查<small>子分支 · 窗口与空状态</small></div></div></div></div>`;c=cursor(745,219,t>4.8&&t<5.2)}else c=cursor(t<1?167:360,t<1?219:32,t<1&&t>.6);label('分支从哪里来，一眼看清',t<1?'01 / 打开关系图':t<5.8?'02 / 查看分支':'03 / 回到会话',t<1?'从当前事项进入 DAG':t<5.8?'主会话与子分支保持关联，选择实现分支':'定位到对应卡片，接着推进当前方案');}
if(scene==='import'){html+=`<main class="viewport"><div class="cards">${t>7?card(0).replaceAll('方案探索','空状态文案').replace('给日历首页设计两个布局方向。','没有日程的时候，显示什么？').replace('先把今天的安排看清楚','今天还没有安排。').replace('建议保留两个方向，分开验证：','添加第一项日程，把时间留给重要的事。').replace('<ul><li>时间线：突出下一件事</li><li>周视图：适合查看空闲时间</li></ul><p>先用示例日程比较阅读体验。</p>','<p class="muted">已导入 Claude Code 的文字记录</p>'):`<section class="card"><div class="cardHead">海岛日历<span class="actions">◫ ⋯</span></div><div class="empty">探索未至之境</div><div class="composer">描述你想要构建的内容<div class="tools"><span>＋</span><span class="send">↑</span></div></div></section>`}</div></main>`;if(t>.7&&t<1.7)html+='<div class="menu"><div>♧ 文件</div><div>⌘ 调用指令</div><div>⇥ 导入会话</div></div>';if(t>=1.7&&t<=7)html+=importModal(t);if(t>7)html+='<div class="toast">✓ 已导入文字记录，原会话保持不变</div>';c=t<1.7?cursor(264,t<.7?519:429,t>.8&&t<1.1):t<4.5?cursor(320,204,t>3&&t<3.3):t<6?cursor(313,305,t>4.5&&t<4.8):cursor(939,496,t>6.1&&t<6.4);label('把已有讨论带进新会话',t<1.7?'01 / 空白会话入口':t<4.5?'02 / 搜索历史':t<7?'03 / 预览并导入':'04 / 继续工作',t<1.7?'点击添加菜单，选择导入会话':t<4.5?'只查当前项目，按来源和关键词筛选':t<7?'先确认文字内容，再导入当前卡片':'保留原始会话，在鲸群中继续讨论');}
document.querySelector('#app').innerHTML=html+c;};window.renderFrame('cards',0);
</script></html>
